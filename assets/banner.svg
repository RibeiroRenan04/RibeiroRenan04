<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Renan Ribeiro — AI Engineer</title>
  <desc id="d">Banner showing a multi-agent orchestration graph with the title AI Engineer.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1558C9" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#030407" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#030407" stop-opacity="0"/>
      <stop offset="1" stop-color="#030407" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1558C9"/>
      <stop offset="1" stop-color="#D4FF24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#030407"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="316" width="1200" height="4" fill="url(#bar)"/>

  <!-- orchestration graph -->
  <g stroke="#1558C9" stroke-width="1.5" fill="none" stroke-opacity="0.85">
    <path d="M900 160 L800 80"/>
    <path d="M900 160 L800 240"/>
    <path d="M900 160 L1030 90"/>
    <path d="M900 160 L1040 230"/>
    <path d="M800 80 L700 130"/>
    <path d="M800 240 L700 200"/>
    <path d="M1030 90 L1120 150"/>
    <path d="M1040 230 L1120 150"/>
    <path d="M700 130 L700 200" stroke-dasharray="4 5"/>
  </g>
  <g fill="#030407" stroke="#1558C9" stroke-width="2">
    <circle cx="800" cy="80" r="11"/>
    <circle cx="800" cy="240" r="11"/>
    <circle cx="1030" cy="90" r="11"/>
    <circle cx="1040" cy="230" r="11"/>
    <circle cx="700" cy="130" r="8"/>
    <circle cx="700" cy="200" r="8"/>
    <circle cx="1120" cy="150" r="8"/>
  </g>
  <circle cx="900" cy="160" r="24" fill="#030407" stroke="#D4FF24" stroke-width="2.5"/>
  <circle cx="900" cy="160" r="8" fill="#D4FF24"/>

  <!-- text -->
  <text x="64" y="112" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="3" fill="#D4FF24">RENAN RIBEIRO</text>
  <text x="62" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">AI Engineer</text>
  <text x="64" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#A8B1C2">Intelligent automation · Multi-agent systems · Agent orchestration</text>
  <text x="64" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#A8B1C2">AI-powered process optimization</text>
</svg>
